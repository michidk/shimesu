[package]
name = "shimesu"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "Self-hosted static publishing platform for AWS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/michidk/shimesu"
homepage = "https://github.com/michidk/shimesu"
keywords = ["aws", "cloudfront", "s3", "static", "publishing"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "shimesu"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }

tokio = { version = "=1.53.3", features = ["full"] }
futures = "=0.3.34"

aws-config = { version = "=1.9.0", features = ["credentials-login"] }
aws-sdk-cloudformation = "=1.118.0"
aws-sdk-sts = "=1.108.0"
aws-sdk-s3 = "=1.138.1"
aws-sdk-dynamodb = "=1.117.0"
aws-sdk-cloudfront = "=1.124.0"
aws-sdk-acm = "=1.108.0"
aws-sdk-route53 = "=1.116.0"
aws-smithy-runtime-api = "=1.13.0"
aws-smithy-types = "=1.6.4"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"

thiserror = "=2.0.21"
anyhow = "=1.0.104"

indicatif = "=0.18.6"
owo-colors = "=4.3.0"
dialoguer = "=0.12.0"

chrono = { version = "=0.4.45", features = ["serde"] }
ulid = "=3.0.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
zip = "=9.1.3"
walkdir = "=2.5.0"
mime_guess = "=2.0.5"
sha2 = "=0.11.1"
hex = "=0.4.3"
dirs = "=7.0.0"
tempfile = "=3.27.0"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
